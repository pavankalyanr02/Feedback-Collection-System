name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Lint, Build & Test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: "file:./test.db"
      JWT_SECRET: "ci_jwt_secret_key_feedback_2026"
      JWT_REFRESH_SECRET: "ci_jwt_refresh_secret_key_feedback_2026"
      PORT: "5000"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Setup Test Database and Seed Data
        run: |
          cd backend
          npx prisma db push --accept-data-loss
          npx prisma db seed

      - name: Build Backend
        run: |
          cd backend
          npm run build

      - name: Run Backend Integration Tests
        run: |
          cd backend
          npm test

  frontend-tests:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
